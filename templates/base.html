<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Support Bundle Collector{% endblock %}</title>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Support Bundle Collector</a>
    {% block nav %}{% endblock %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>No cookies, storage, passwords, tokens or history are ever collected.</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
